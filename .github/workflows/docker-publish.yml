name: Build, Test, and Push Docker Image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: discord-cleanup
      DOCKERHUB_USER: kwv4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go tests
        run: go test -v ./...

      - name: Extract version from tag
        id: extract
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION is $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists on Docker Hub
        id: check-tag
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          VERSION="${{ steps.extract.outputs.version }}"
          IMAGE="${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}"
          TAG_EXISTS=$(curl -s https://hub.docker.com/v2/repositories/$IMAGE/tags/$VERSION/ | jq -r '.name // empty')
          if [ "$TAG_EXISTS" = "$VERSION" ]; then
            echo "::error file=release.yml::Tag ${{ steps.extract.outputs.version }} already exists on Docker Hub. Aborting release."
            exit 1
          else
            echo "Tag ${{ steps.extract.outputs.version }} is available."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }} 
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.extract.outputs.version }}
          tags: |
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ steps.extract.outputs.version }}
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest
